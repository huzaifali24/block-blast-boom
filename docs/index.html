<style>
  :root { --bg:#FAFAF8; --text:#15171C; --sub:#5B6070; --line:#E6E6E1; --card:#fff; --accent:#2F6BFF; }
  @media (prefers-color-scheme: dark) { :root { --bg:#15171C; --text:#F2F2EF; --sub:#A3A8B6; --line:#2C3039; --card:#1D2027; --accent:#7EA3FF; } }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  main { max-width:640px; margin:0 auto; padding:48px 16px; }
  h1 { font-size:26px; margin:0 0 6px; }
  p { color:var(--sub); margin:0 0 24px; }
  a.card { display:block; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px 18px; color:var(--text); text-decoration:none; margin-bottom:12px; }
  a.card span { color:var(--accent); font-size:14px; }
</style>
